services:
  lingproxy-backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: lingproxy-backend:latest
    container_name: lingproxy-backend
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    volumes:
      - ../logs:/app/logs
      - ../run:/app/run
      - lingproxy-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lingproxy-network

  lingproxy-frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    image: lingproxy-frontend:latest
    container_name: lingproxy-frontend
    ports:
      - "3000:80"
    depends_on:
      lingproxy-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - lingproxy-network

  # Optional MySQL-compatible database. Not required for the default SQLite setup.
  # Start with: docker compose --profile seekdb -f docker/docker-compose.yml up -d
  seekdb:
    profiles: ["seekdb"]
    image: oceanbase/seekdb:latest
    container_name: seekdb
    ports:
      - "2881:2881"
      - "2886:2886"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - seekdb-data:/var/lib/oceanbase
    restart: unless-stopped
    networks:
      - lingproxy-network

volumes:
  lingproxy-data:
    driver: local
  seekdb-data:
    driver: local

networks:
  lingproxy-network:
    driver: bridge
